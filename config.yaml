# Lectra AI Configuration

audio:
  sample_rate: 16000  # 16kHz for optimal processing
  chunk_duration: 30  # seconds per chunk for processing
  
vad:
  min_segment_ms: 80  # ENHANCEMENT 3: drop segments shorter than this
  # Pre-VAD trim settings
  aggressiveness: 3  # 0-3, higher = more aggressive filtering
  frame_duration_ms: 30  # 10, 20, or 30 ms
  padding_duration_ms: 300  # padding around speech segments
  min_speech_duration_ms: 250  # minimum speech segment length
  
high_pass_filter:
  enabled: true       # ENHANCEMENT 1
  cutoff_hz: 120      # ENHANCEMENT 1
  
deepfilternet:
  model: "DeepFilterNet3"  # DeepFilterNet2 or DeepFilterNet3
  post_filter: false  # OFF: post-filter sharpens the mask and gates out quiet consonants/syllables
  atten_lim_db: 30  # strong noise removal in the wet path; syllables are restored via the band-limited dry mix below
  dry_wet_mix: 0.0   # OFF — MetricGAN+ now restores/cleans; dry mix no longer needed (it re-added noise)
  dry_mix_hpf_hz: 800

# Neural enhancer: MetricGAN+ runs AFTER DeepFilterNet as a final neural polish.
# This is the "separator"-style denoiser — light, faster-than-realtime on CPU,
# bounded spectral mask (no artifacts). Chain: DeepFilterNet -> MetricGAN+.
# Gets ~40 dB speech-to-noise (perceptually clean) with words intact.
neural_enhancer:
  enabled: true     # set false to fall back to DeepFilterNet-only
  model: "metricgan-plus-voicebank"

low_band_denoise:
  enabled: false    # OFF — MetricGAN+ handles the rumble now (reverted to original default)
  cutoff_hz: 700
  strength: 0.85

# Voice Beautify: post-cleaning master applied to the SPEECH SEGMENTS ONLY, after
# all noise removal. Makes the clean voice sound smooth/natural instead of
# "broken-speaker". SNR-guarded — if any stage would add noise it auto-disables.
# Does NOT touch noise removal or diarization.
beautify:
  enabled: false                 # OFF — output is the raw 16kHz DFN->MetricGAN+ cleaned voice (reverted to original default)
  target_loudness_dbfs: -19      # consistent broadcast-ish loudness
  max_snr_drop_db: 6             # safety: abort a stage if speech-to-noise drops more than this
  tone:
    enabled: true                # gentle corrective EQ (tame boom, add clarity, de-harsh)
  leveler:
    enabled: true                # downward compression only — evens loud jumps, never boosts noise
    strength: 0.7
    gate_dbfs: -50               # never process below this (protects the residual floor)
    # Air = a NATURAL high-band extension. It scales to the input's own HF (an
    # anchor), so band-limited inputs (e.g. WhatsApp/Opus) get almost none and
    # can't grow a harsh shelf. amount_db = how far BELOW that anchor the air sits.
  air:
    enabled: true                # synthesize subtle >8kHz "air"; output at higher sample rate
    output_sr: 24000
    amount_db: -9                # dB below the existing HF anchor (more negative = subtler)

diarization:
  enabled: true
  min_speakers: 1
  max_speakers: 10

# Target Voice Isolation: separates genuinely overlapping speech (e.g. a
# student talking over the lecturer, or voice-like background chatter)
# BEFORE DeepFilterNet/MetricGAN+ run. Those two are speech-preserving
# denoisers - they crush stationary noise (~-73dB measured) but cannot
# remove a second voice, since anything voice-like is exactly what they're
# built to protect (measured: only ~-2dB change on overlapping speech).
# This stage runs speaker separation only on the short windows diarization
# flags as genuinely overlapping, matches each resulting stream back to a
# known speaker by voice embedding, and falls back to the original
# untouched audio for that window on any low-confidence/artifact signal -
# never risks making a non-overlapping file worse. See
# docs/NOISE_REMOVAL_AND_DIARIZATION.md "Problem 4" for the measured
# before/after and why this is safe despite Problem 3's earlier rejection
# of a different SepFormer checkpoint for a different (denoising) task.
target_voice_isolation:
  enabled: true                      # ON for live GPU-worker evaluation (see docs "Problem 4") - revisit after real results
  require_gpu: true                  # skip (safe no-op) on CPU - measured ~7x realtime per Problem 3
  min_overlap_duration_s: 0.3        # ignore sub-threshold overlaps, not worth the compute
  min_speaker_duration_s: 5.0        # ignore one-off blips (cough, chair scrape) as "speakers"
  match_confidence_threshold: 0.65   # below this, keep the original audio for that window
  context_padding_s: 0.5             # model context padded around each window before separating
  crossfade_s: 0.25                  # crossfade width when splicing isolated audio back in
  low_freq_gate_hz: 150              # reject a separated stream if energy below this INCREASES

# Speaker Confidence Gate: unlike target_voice_isolation above (only acts on
# diarization-flagged overlap between 2 RECOGNIZED speakers), this runs
# CONTINUOUSLY across the whole file, attenuating audio that doesn't
# confidently match a known/legitimate speaker even during stretches
# diarization only labeled ONE speaker as active - closes the gap measured
# live this session (a solo-lecturer stretch got only -0.3dB reduction vs.
# true silence's -36 to -90dB, because faint background voice-like content
# too quiet/diffuse to cluster as its own speaker turn is invisible to both
# target_voice_isolation and DeepFilterNet/MetricGAN+). See
# docs/NOISE_REMOVAL_AND_DIARIZATION.md "Problem 5". Touches every speech
# frame in the file (not rare flagged windows), so the safety margin here is
# wider: attenuation is bounded (never full silence) AND only engages after
# a SUSTAINED run of low-confidence hops, not a single one - a brief dip
# (cough, or genuine cross-talk between two legitimate speakers whose
# blended embedding doesn't cleanly match either centroid) never triggers
# it alone.
speaker_confidence_gate:
  enabled: true                        # ON for live local-CPU evaluation - revisit after real results
  require_gpu: false                   # measured ~0.3x realtime on this project's own CPU
                                        # (scripts/benchmark_speaker_confidence_gate.py) - real
                                        # cost but sub-realtime, unlike target_voice_isolation's
                                        # separator model
  min_speaker_duration_s: 5.0          # same "legitimate speaker" bar as target_voice_isolation
  window_s: 0.75                       # analysis window per confidence check
  hop_s: 0.2                           # how often confidence is re-evaluated
  embedding_batch_size: 32             # batch windows before embedding - mirrors diarization.py's
                                        # own embedding_batch_size; the load-bearing perf fix
  match_confidence_threshold: 0.6      # below this, a hop "doesn't match a known speaker" -
                                        # calibrate from real cosine-similarity distributions,
                                        # not guessed (different comparison than
                                        # target_voice_isolation's threshold)
  min_low_confidence_duration_s: 0.6   # required sustained evidence before attenuation engages
  max_attenuation_db: -15              # bounded, never full silence - protects a false positive
                                        # on the real speaker's own atypical-sounding moment
  attack_s: 0.05                       # how fast suppression kicks in once triggered
  release_s: 0.3                       # how fast suppression releases (slower - avoids pumping)

asr:
  skip: false  # enabled for transcript + study assistant flow
  model: "turbo"  # tiny, base, small, medium, large, large-v3, turbo (recommended)
  language: null  # auto-detect if null
  compute_type: "int8"  # int8 (fastest on CPU), float16, or float32
  device: "cpu"  # cpu or cuda (auto-detect if not set)
  
cache:
  enabled: true  # speed up repeated processing of the same file/config

# ============================================================================
# Custom DSP Modules (Experimental - disabled by default)
# ============================================================================

profiler:
  enabled: false  # Enable audio quality profiling before processing
  wavelet: 'db8'  # Wavelet type for noise estimation (db4, db8, sym4, etc.)

adaptive_router:
  enabled: false  # Enable intelligent processing method selection
  fallback_to_deepfilter: true  # Always use DeepFilterNet if router fails

spectral_restoration:
  enabled: false  # Enable post-processing spectral restoration
  strength: 'auto'  # Restoration strength: 'auto', 'light', 'medium', 'heavy'

quality_metrics:
  enabled: false  # Enable quality metrics computation
  compute_composite_score: true  # Compute overall quality score (0-100)

# ============================================================================
  
output:
  format: "wav"  # wav, mp3, flac
  bit_depth: 16  # 16 or 24 for wav
  preserve_video: true  # if input is video, merge cleaned audio back
